name: Deploy partner panel to production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Mirrors the admin panel's workflow deliberately: same build-on-server, same
# staged swap, same rollback. Four near-identical pipelines are easier to reason
# about at 2am than four clever ones.
#
# Config comes from the `production` environment's Variables, not from a file anyone
# edits on the box — see the .env written below. The port is whatever
# PARTNER_PORT says, so it appears exactly once.
#
# One-time server setup before this can succeed:
#   - aaPanel site partners.wapzio.com + Let's Encrypt, reverse proxy to
#     127.0.0.1:<PARTNER_PORT>, proxy cache OFF
#   - repo Secrets: SSH_HOST, SSH_PORT, SSH_USER, SSH_PRIVATE_KEY
#   - `production` environment Variables: NEXT_PUBLIC_API_URL, NEXT_PUBLIC_FRONT_URL,
#     NEXT_PUBLIC_RECAPTCHA_SITE_KEY, PARTNER_PORT
# The first run creates the .env, builds, and starts pm2 itself.
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Variables are read from THIS environment, so the same names
    # (NEXT_PUBLIC_API_URL and friends) can hold test values here and
    # production values in the `production` environment, instead of one
    # repository-wide value that can only ever point at one backend.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Fail on the runner, where the message is readable, rather than three
      # steps later on the server with an empty API URL baked into the build.
      - name: Check required repo variables
        run: |
          missing=""
          [ -z "${{ vars.NEXT_PUBLIC_API_URL }}" ] && missing="$missing NEXT_PUBLIC_API_URL"
          [ -z "${{ vars.NEXT_PUBLIC_FRONT_URL }}" ] && missing="$missing NEXT_PUBLIC_FRONT_URL"
          if [ -n "$missing" ]; then
            echo "Missing repository Variables:$missing"
            echo "Set them under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          echo "Variables present."

      - name: Install dependencies
        run: npm ci

      # Gate only — the deployable build is produced on the server, so a partly
      # transferred .next can never reach the live site. This stops broken code
      # from being deployed at all.
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Sync source to server
        uses: burnett01/rsync-deployments@7.0.2
        with:
          # Every .gitignore entry must also appear as an --exclude here. A
          # gitignored path is never in the runner's checkout, so --delete would
          # otherwise remove it from the server on every deploy.
          switches: -avzr --delete --exclude=node_modules --exclude=.next --exclude=.next-build --exclude=.next-old --exclude=out --exclude=*.tsbuildinfo --exclude=next-env.d.ts --exclude=.env --exclude=.env.local --exclude=.git --exclude=.user.ini --exclude=.well-known --exclude=.htaccess
          path: ./
          remote_path: /www/wwwroot/partners.wapzio.com/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Build on server and swap into place
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            source /etc/profile
            cd /www/wwwroot/partners.wapzio.com

            # Config lives in GitHub repo Variables, not hand-edited on the box.
            # Written before the build because NEXT_PUBLIC_* are baked in at build
            # time, and read again at start-up for PORT — one file, so the running
            # app and the build can never disagree about which backend they use.
            cat > .env <<ENVEOF
            PORT=${{ vars.PARTNER_PORT }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_FRONT_URL=${{ vars.NEXT_PUBLIC_FRONT_URL }}
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
            ENVEOF
            chmod 600 .env

            # Read it back so the start command, the health check and the cache
            # purge all use the one port the environment declared — a port
            # repeated in four places is a port that eventually disagrees.
            set -a; . ./.env; set +a
            PORT="${PORT:?PARTNER_PORT must be set in the production environment}"
            echo "Deploying on port $PORT"

            npm ci

            # Build into a staging dir. NEXT_PUBLIC_* come from the server's
            # .env, so the running app and the build always agree on which
            # backend they talk to.
            rm -rf .next-build
            NEXT_DIST_DIR=.next-build NEXT_PUBLIC_DEPLOYMENT_ID=${{ github.sha }} npm run build

            # Sanity check before anything live is touched
            test -f .next-build/BUILD_ID
            test -d .next-build/static/chunks

            # Swap: from here the site is either fully on the old build or fully
            # on the new one. HAD_PREVIOUS records whether there is anything to
            # roll back to — on a first deploy there is not, and a blind
            # `mv .next-old .next` would fail the job after a good build.
            HAD_PREVIOUS=no
            rm -rf .next-old
            if [ -d .next ]; then mv .next .next-old; HAD_PREVIOUS=yes; fi
            mv .next-build .next

            # Plain restart, no --update-env: pm2's remembered env is where PORT
            # lives, and losing it drops the app onto Next's default 3000 while
            # nginx keeps proxying the configured port.
            #
            # First deploy has no pm2 process yet, so start one, taking PORT from
            # the server .env rather than hardcoding it in two places.
            if pm2 describe wapzio-partners > /dev/null 2>&1; then
              pm2 restart wapzio-partners
            else
              echo "No pm2 process yet — starting one"
              PORT="$PORT" pm2 start npm --name wapzio-partners -- start
              pm2 save
            fi
            sleep 4

            # nginx proxy_cache keys whole HTML pages by URL. A page cached from
            # the previous build references chunks this build no longer emits,
            # so the browser 404s on them and the panel hangs on a spinner.
            if [ -d /www/server/nginx/proxy_cache_dir ]; then
              grep -rla "KEY: http://127.0.0.1:$PORT" /www/server/nginx/proxy_cache_dir 2>/dev/null | xargs -r rm -f
              echo "nginx cache purged for 127.0.0.1:$PORT"
            fi

            # Roll back if the new build will not serve. /login is the only page
            # that renders without a session, so it is the honest health check.
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:$PORT/login || echo 000)
            if [ "$CODE" != "200" ]; then
              echo "New build returned $CODE"
              if [ "$HAD_PREVIOUS" = "yes" ]; then
                echo "Rolling back to the previous build"
                rm -rf .next
                mv .next-old .next
                pm2 restart wapzio-partners
                grep -rla "KEY: http://127.0.0.1:$PORT" /www/server/nginx/proxy_cache_dir 2>/dev/null | xargs -r rm -f
              else
                # Nothing to roll back to. Usually the reverse proxy or the .env
                # is not in place yet; the build itself is fine and stays.
                echo "First deploy — nothing to roll back to. Check the .env, the pm2 log (pm2 logs wapzio-partners) and the nginx proxy to 127.0.0.1:$PORT."
              fi
              exit 1
            fi

            echo "Deploy OK (HTTP $CODE, build $(cat .next/BUILD_ID))"
            rm -rf .next-old
